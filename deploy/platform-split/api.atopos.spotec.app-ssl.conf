<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.atopos.spotec.app
    ProxyTimeout 300
    ProxyPreserveHost On
    ProxyPass /api/presence ws://127.0.0.1:8084/api/presence retry=0 timeout=120
    ProxyPassReverse /api/presence ws://127.0.0.1:8084/api/presence
    ProxyPass / http://127.0.0.1:8084/
    ProxyPassReverse / http://127.0.0.1:8084/
    SSLCertificateFile /etc/letsencrypt/live/api.atopos.spotec.app/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.atopos.spotec.app/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
