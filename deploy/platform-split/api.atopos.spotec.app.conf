<VirtualHost *:80>
    ServerName api.atopos.spotec.app
    DocumentRoot /var/www/letsencrypt
    <Directory /var/www/letsencrypt>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://api.atopos.spotec.app%{REQUEST_URI} [END,NE,R=301]
</VirtualHost>
