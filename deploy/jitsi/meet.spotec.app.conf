<VirtualHost *:80>
    ServerName meet.spotec.app
    DocumentRoot /var/www/letsencrypt
    <Directory /var/www/letsencrypt>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://meet.spotec.app%{REQUEST_URI} [R=301,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/meet.spotec.app-error.log
    CustomLog ${APACHE_LOG_DIR}/meet.spotec.app-access.log combined
</VirtualHost>
