<VirtualHost *:443>
    ServerName meet.spotec.app
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/meet.spotec.app/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/meet.spotec.app/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass /xmpp-websocket ws://127.0.0.1:8180/xmpp-websocket
    ProxyPassReverse /xmpp-websocket ws://127.0.0.1:8180/xmpp-websocket
    ProxyPass /colibri-ws/ ws://127.0.0.1:8180/colibri-ws/
    ProxyPassReverse /colibri-ws/ ws://127.0.0.1:8180/colibri-ws/
    ProxyPass / http://127.0.0.1:8180/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:8180/
    Header always set Referrer-Policy "no-referrer"
    ErrorLog ${APACHE_LOG_DIR}/meet.spotec.app-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/meet.spotec.app-ssl-access.log "%a %t \"%m %U %H\" %>s %b"
</VirtualHost>
