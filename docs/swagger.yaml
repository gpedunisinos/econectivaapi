externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: api.uniusp.gpedu.com.br
info:
  contact:
    email: contact@spotec.app
    name: API Support
    url: https://spotec.app/contato/
  description: API da plataforma Educação Onlife
  title: Educação Onlife
  version: 0.7.4
paths:
  /ai/messages:
    get:
      consumes:
      - application/json
      description: Get authenticated user AI chat history
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AIMessage'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/models.APIMessage'
      security:
      - Bearer: []
      summary: Get AI messages
      tags:
      - ai_messages
    post:
      consumes:
      - application/json
      description: Conversa global com contexto estruturado atual, consultas MCP autorizadas
        e histórico próprio por usuário. O contexto do cliente nunca concede autorização.
      parameters:
      - description: AI message
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/requests.SendAIMessageInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AIMessage'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/models.APIMessage'
      security:
      - Bearer: []
      summary: Send AI message
      tags:
      - ai_messages
  /ai/voice/speech:
    post:
      consumes:
      - application/json
      description: Sintetiza somente uma mensagem assistant do próprio usuário. Voz
        gerada por IA; áudio não é armazenado. A falha de voz não altera o histórico
        de texto.
      parameters:
      - description: Mensagem da IAraeté
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/controllers.AISpeechInput'
      produces:
      - audio/wav
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIMessage'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIMessage'
      security:
      - Bearer: []
      summary: Ouvir uma resposta da IAraeté
      tags:
      - ai_messages
  /ai/voice/transcriptions:
    post:
      consumes:
      - multipart/form-data
      description: Recebe WAV PCM16 mono 16kHz entre 0,5 e 120 segundos. Processa
        em memória e descarta o áudio. Não salva mensagens; a transcrição segue pelo
        endpoint normal de conversa.
